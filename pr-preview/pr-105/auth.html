<style>
:root{
  --bg:#050a16;
  --card:#0a1226;
  --card-edge:#1b2a4a;
  --blue:#2f8bff;
  --blue-glow:rgba(47,139,255,.55);
  --text:#f2f5fb;
  --muted:#8fa0bd;
  --input:#0e1830;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.wrap{
  position:relative;
  min-height:100dvh;
}
/* MOBILE: full-bleed scene (Herman top, blank floor below), card floats over the floor */
.art{
  position:absolute;inset:0;z-index:0;
  overflow:hidden;
  background:var(--bg);
}
.art img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:left top;
}
.art::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom, transparent 55%, rgba(5,10,22,.38) 100%);
  pointer-events:none;
}
.art .placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;
}
.panel{
  position:relative;z-index:1;
  min-height:100dvh;
  display:flex;align-items:flex-end;justify-content:center;
  padding:46dvh 16px 20px;
}
.card{
  width:min(440px,100%);
  background:linear-gradient(180deg, rgba(16,26,52,.92), rgba(8,14,32,.96));
  border:1px solid var(--card-edge);
  border-radius:22px;
  padding:28px 24px 24px;
  text-align:center;
  box-shadow:
    0 0 0 1px rgba(47,139,255,.25),
    0 0 34px -6px var(--blue-glow),
    0 24px 60px -20px rgba(0,0,0,.8);
}
.logo{font-weight:800;font-size:clamp(30px,6vw,40px);letter-spacing:-.02em;line-height:1}
.logo .p1{color:var(--text)}
.logo .p2{color:var(--blue)}
.logo .tld{font-size:.55em;color:var(--text);font-weight:700}
.divider{
  display:flex;align-items:center;gap:12px;
  margin:18px auto 16px;max-width:280px;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent)}
.divider .swirl{font-size:20px;line-height:1;filter:hue-rotate(160deg) saturate(3) brightness(1.4)}
.tagline{color:var(--muted);font-size:15.5px;margin-bottom:24px}
.btn{
  display:flex;align-items:center;gap:14px;
  width:100%;
  background:var(--input);
  border:1px solid var(--card-edge);
  border-radius:14px;
  padding:15px 18px;
  color:var(--text);
  font-size:16.5px;font-weight:600;font-family:inherit;
  cursor:pointer;
  transition:border-color .15s, box-shadow .15s, transform .1s;
}
.btn+.btn{margin-top:12px}
.btn:hover{border-color:var(--blue);box-shadow:0 0 18px -6px var(--blue-glow)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn .ic{flex:0 0 26px;display:flex;align-items:center;justify-content:center}
.btn .lbl{flex:1;text-align:center;padding-right:26px}
/* magic link state */
.hidden{display:none !important}
.email-row{display:flex;gap:10px;margin-top:12px}
.email-row input{
  flex:1;
  background:var(--input);
  border:1px solid var(--card-edge);
  border-radius:14px;
  padding:15px 16px;
  color:var(--text);font-size:16px;font-family:inherit;
}
.email-row input::placeholder{color:var(--muted)}
.email-row input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 14px -6px var(--blue-glow)}
.email-row button{
  background:var(--blue);
  border:none;border-radius:14px;
  padding:0 22px;
  color:#04122b;font-weight:700;font-size:15px;font-family:inherit;
  cursor:pointer;transition:filter .15s, transform .1s;
}
.email-row button:hover{filter:brightness(1.12)}
.email-row button:active{transform:scale(.97)}
.email-row button:disabled{opacity:.55;cursor:default}
.status{margin-top:14px;font-size:14px;min-height:20px}
.status.ok{color:#5cd490}
.status.err{color:#ff7a6b}
.fine{margin-top:20px;color:var(--muted);font-size:12.5px}
.fine a{color:var(--blue);text-decoration:none}
#gsiButton{margin-top:2px;display:flex;justify-content:center}
/* DESKTOP: art left, card right, like the landscape mockup */
@media (min-width:900px){
  .wrap{display:flex;flex-direction:row;position:static}
  .art{position:relative;inset:auto;z-index:auto;flex:1.15;height:100dvh;min-height:100dvh;overflow:hidden}
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center}
  .art::after{background:linear-gradient(to right, transparent 55%, var(--bg) 100%)}
  .panel{position:static;z-index:auto;flex:1;min-height:100dvh;align-items:center;padding:40px}
  .card{padding:34px 30px 30px}
}
@media (prefers-reduced-motion: no-preference){
  .card{animation:cardIn .5s ease-out}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
}
.cookie-consent{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:none;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:14px 18px;background:rgba(8,14,32,.96);border-top:1px solid var(--card-edge);backdrop-filter:blur(10px);color:var(--text);font-size:14px}
.cookie-consent.show{display:flex}
.cookie-consent-text{margin:0;max-width:760px;line-height:1.5}
.cookie-consent-text a{color:var(--blue);font-weight:600}
.cookie-consent-btn{flex:0 0 auto;background:var(--blue);color:#04122b;border:none;border-radius:10px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.cookie-consent-btn:hover{filter:brightness(1.05)}
.auth-privacy-link{position:fixed;left:0;right:0;bottom:8px;text-align:center;z-index:2;font-size:12px}
.auth-privacy-link a{color:var(--muted);text-decoration:none}
.auth-privacy-link a:hover{color:var(--text);text-decoration:underline}
</style>
</head>

<script>
/* ================= CONFIG ================= */
var GOOGLE_CLIENT_ID = "818996284466-8m14ddvs91vmad2lkao11p56g1drttpe.apps.googleusercontent.com";
var SUPABASE_URL     = "https://ukfboxemqwuwkvfglzfq.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrZmJveGVtcXd1d2t2ZmdsemZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDk0OTQsImV4cCI6MjA5NjI4NTQ5NH0.nXvi3ZEimwuZHfWR2DZlxX1YYzrdMe_UvZa6NkKN4Og";
var APP_URL = "app.html";
function appRedirectUrl() {
  return new URL(APP_URL, window.location.href).href;
}
/* ========================================== */

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var statusEl = document.getElementById("status");
function setStatus(msg, ok){ statusEl.textContent = msg; statusEl.className = "status " + (ok ? "ok" : "err"); }
function track(ev, params){ if (typeof gtag === "function") gtag("event", ev, params || {}); }

/* Already signed in? Straight to the app. */
sb.auth.getSession().then(function(res){
  if (res.data && res.data.session) window.location.replace(appRedirectUrl());
});

/* Responsive art swap (portrait under 900px, landscape above) */
(function(){
  var p = document.getElementById("artPortrait");
  var l = document.getElementById("artLandscape");
  var ph = document.getElementById("artPlaceholder");
  function pick(){
    var wide = window.matchMedia("(min-width: 900px)").matches;
    var img = wide ? l : p;
    var other = wide ? p : l;
    other.style.display = "none";
    if (img.getAttribute("src")) { img.style.display = "block"; ph.style.display = "none"; }
    else { img.style.display = "none"; ph.style.display = "flex"; }
  }
  window.addEventListener("resize", pick); pick();
})();

/* ---------- Google One Tap + button ---------- */
async function handleGoogle(response){
  track("auth_signin_start", { method: "google" });
  setStatus("Signing you in...", true);
  var res = await sb.auth.signInWithIdToken({ provider: "google", token: response.credential });
  if (res.error) { setStatus("Google sign-in failed: " + res.error.message, false); return; }
  track("auth_signin_success", { method: "google" });
  window.location.replace(appRedirectUrl());
}
window.addEventListener("load", function(){
  if (!window.google || !google.accounts) return; /* script blocked; visible button still shows guidance */
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogle,
    use_fedcm_for_prompt: true
  });
  google.accounts.id.renderButton(document.getElementById("gsiButton"), { theme: "filled_black", size: "large", width: 320, text: "continue_with" });
  google.accounts.id.prompt(); /* One Tap */
  /* Our styled button just nudges people to the official rendered one */
  document.getElementById("googleBtn").classList.add("hidden");
});
/* Fallback if GSI fails to load: styled button explains */
document.getElementById("googleBtn").addEventListener("click", function(){
  setStatus("Google sign-in is loading... if this persists, use the magic link below.", false);
});

/* ---------- Magic link ---------- */
var authButtons = document.getElementById("authButtons");
var emailForm = document.getElementById("emailForm");
var emailInput = document.getElementById("emailInput");
var sendBtn = document.getElementById("sendBtn");
var backBtn = document.getElementById("backBtn");

document.getElementById("magicBtn").addEventListener("click", function(){
  authButtons.classList.add("hidden");
  emailForm.classList.remove("hidden");
  backBtn.classList.remove("hidden");
  emailInput.focus();
  track("auth_signin_start", { method: "magic_link" });
});
backBtn.addEventListener("click", function(){
  emailForm.classList.add("hidden");
  backBtn.classList.add("hidden");
  authButtons.classList.remove("hidden");
  setStatus("", true);
});
async function sendMagic(){
  var email = (emailInput.value || "").trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setStatus("Enter a valid email address.", false); return; }
  sendBtn.disabled = true; setStatus("Sending your link...", true);
  var res = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: appRedirectUrl() } });
  sendBtn.disabled = false;
  if (res.error) { setStatus("Could not send the link: " + res.error.message, false); return; }
  setStatus("Link sent. Check your inbox (and spam) and click it on this device.", true);
  track("auth_signin_success", { method: "magic_link_sent" });
}
sendBtn.addEventListener("click", sendMagic);
emailInput.addEventListener("keydown", function(e){ if (e.key === "Enter") sendMagic(); });
</script>
