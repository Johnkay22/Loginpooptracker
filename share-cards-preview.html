<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Share Card Preview</title>
<style>
  body { margin: 0; background: #0b0f18; color: #dfe8f5; font: 14px system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #8ba0bd; margin: 0 0 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: #8ba0bd; margin-top: 6px; }
  canvas { display: block; width: 300px; height: auto; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>
<h1>Poop Profit share cards (dev preview, not linked from the site)</h1>
<p>Sample data. Every card is drawn by js/pp-share-cards.js. Add ?currency=KRW to test long numbers.</p>
<div class="grid" id="grid"></div>
<script src="js/pp-share-cards.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var krw = params.get("currency") === "KRW";
  function fmt(n) {
    return krw
      ? "₩" + Math.round(n * 1350).toLocaleString("en-US")
      : "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  PPShareCards.configure({
    basePath: "",
    money: fmt,
    moneyUsd: function (n) { return "$" + n.toFixed(2); },
    moneyWhole: function (n) { return krw ? fmt(n) : "$" + Math.round(n).toLocaleString("en-US"); }
  });

  // Fake history: ~7 months of sessions, ending today.
  var now = Date.now();
  var DAY = 86400000;
  var sessions = [];
  var seed = 7;
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var d = 210; d >= 0; d--) {
    var count = rand() < 0.2 ? 0 : 1 + Math.floor(rand() * 2.4);
    for (var i = 0; i < count; i++) {
      var dur = 180 + Math.floor(rand() * 900);
      var ended = now - d * DAY - Math.floor(rand() * 8) * 3600000;
      var s = { endedAtMs: ended, durationSeconds: dur, earnings: Math.round(dur / 3600 * 34.5 * 100) / 100, rating: Math.floor(rand() * 6) };
      if (rand() < 0.7) { s.tp_squares = 6 + Math.floor(rand() * 14); s.tp_savings = s.tp_squares * 0.0104; }
      sessions.push(s);
    }
  }
  sessions.sort(function (a, b) { return b.endedAtMs - a.endedAtMs; });

  var latest = { endedAtMs: now, durationSeconds: 402, earnings: 3.85, rating: 4, tp_squares: 14, tp_savings: 0.15 };

  function bounds(kind) {
    var s = new Date(); var e = new Date(); e.setHours(23, 59, 59, 999);
    if (kind === "week") s.setDate(s.getDate() - s.getDay());
    if (kind === "month") s.setDate(1);
    if (kind === "year") s.setMonth(0, 1);
    if (kind === "custom") s.setDate(s.getDate() - 44);
    s.setHours(0, 0, 0, 0);
    return [s.getTime(), e.getTime()];
  }
  function period(kind) {
    var b = bounds(kind);
    var list = sessions.filter(function (x) { return x.endedAtMs >= b[0] && x.endedAtMs <= b[1]; });
    return PPShareCards.buildPeriodData(list, kind, b[0], b[1]);
  }

  var allTime = PPShareCards.buildAllTimeData(sessions, { projectedAnnual: 1840 });

  var cards = [
    ["session", PPShareCards.buildSessionData(latest)],
    ["session-no-extras", PPShareCards.buildSessionData({ endedAtMs: now, durationSeconds: 1104, earnings: 10.58, rating: 0 })],
    ["week", period("week")],
    ["month", period("month")],
    ["alltime", allTime],
    ["custom", period("custom")],
    ["today", period("today")]
  ];

  var grid = document.getElementById("grid");
  var jobs = [];
  cards.forEach(function (card) {
    ["story", "post"].forEach(function (format) {
      var fig = document.createElement("figure");
      var canvas = document.createElement("canvas");
      canvas.id = "card-" + card[0] + "-" + format;
      var cap = document.createElement("figcaption");
      cap.textContent = card[0] + " / " + format + "  ·  " + PPShareCards.captionFor(card[1]);
      fig.appendChild(canvas);
      fig.appendChild(cap);
      grid.appendChild(fig);
      jobs.push(PPShareCards.render(card[1], { format: format, canvas: canvas }));
    });
  });
  Promise.all(jobs).then(function () { document.body.setAttribute("data-ready", "1"); });
})();
</script>
</body>
</html>
